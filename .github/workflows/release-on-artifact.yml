name: Release on artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release date
        run: echo "RELEASE_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Create release artifact
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output="dist/CV_MaD-${RELEASE_DATE}.tar.gz" HEAD

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/CV_MaD-${{ env.RELEASE_DATE }}.tar.gz

  create-release:
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Set release metadata
        run: |
          echo "RELEASE_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=release-$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Release $(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_NAME" \
              --notes "Automated release generated on $RELEASE_DATE."
          fi
